output:
  logs_dir: "logs"

pipeline:
  steps:
    "01_save_session": false
    "02_capture_document_html": true
    "03_extract_from_document": true
    "select_events": true
    "20_make_risk_windows": false
    "30_refresh_actuals": false
    "40_compute_surprise": false

  cleanup:
    enabled: true
    target_dir: "python/Data/raw_data/calendar"
    remove_files:
      - "calendar_document.html"
      - "calendar_document.meta.json"
      - "document_debug.png"
      - "capture_error.txt"
      - "extract_error.txt"
    remove_globs:
      - "*.tmp"
      - "*.temp"
      - "*.bak"
      - "*debug*"
    keep_files:
      - "latest_select_events.json"
      - "calendar_select_events.json"
      - "calendar_select_events.csv"
      - "select_events.meta.json"
      - "calendar_all_event.json"
      - "calendar_all_event.csv"
      - "events.meta.json"

capture_document_html:
  url: "https://www.forexfactory.com/calendar?"

select_events:
  currencies:
    - "EUR"
    - "USD"
  impacts:
    - "high"
    - "medium"
  days_back: -30
  days_forward: 50
  impact_score_min: null
  countries: []
  name_keywords: []
  exclude_name_keywords: []

telegram:
  enabled: true
  bot_token: "" # ใช้จาก .env (TELEGRAM_BOT_TOKEN)
  chat_id: "" # ใช้จาก .env (TELEGRAM_CHAT_ID)
  send_on_success: true
  send_on_warning: true
  send_on_error: true
